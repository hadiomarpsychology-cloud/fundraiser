lass="help" data-t="deskText"></p><input id="question" maxlength="400"><button id="ask" type="button" data-t="ask"></button><div id="answer" class="answer" role="status" aria-live="polite"></div></div></div></section><section class="support" id="support"><div class="wrap"><h2 data-t="support"></h2><p data-t="supportText"></p></div></section></main><footer><div class="wrap" data-t="footer"></div></footer><script>const T={"ar":{"nav":["المشاريع","المصفوفة السيادية","مكتب المعلومات","الدعم","ملف التوظيف","القرآن"],"tag":"أعمال مستقلة • معرفة وثقافة وإبداع","hero":"أفكار مستقلة. منصة واحدة نابضة بالحياة.","lead":"منصة مستقلة تجمع النشر والبحث العلمي والموسيقى والتراث الثقافي، وتحترم الخصوصية وحقوق المؤلف.","explore":"استكشف المشاريع","jobs":"جهّز طلبات التوظيف","note":"لا تُحصّل أي مدفوعات عبر هذا الموقع.","ecosystem":"مساحات العمل","work":"تعرّف على أعمالنا","cards":[["غرفة القراءة","مشاريع تحريرية وكتب قيد الإعداد، ومنها «عدالة مجتمعنا». لم تُنشر المخطوطات الكاملة بعد."],["مكتب الأبحاث","علم النفس وأخلاقيات البحث والمنهجية والدراسات العابرة للثقافات. المنشورات العلمية قيد الإعداد."],["الموسيقى والإنتاج","التأليف والإنتاج والأداء الموسيقي. لا تُنشر المواد الصوتية قبل اعتمادها."],["القرآن الكريم","قسم قراءة القرآن باللغة العربية؛ تُطوّر مواد التصفح والترجمة مع ضرورة مراجعتها."],["التراث الثقافي","دراسات ثقافية ومقارنات لغوية، مع هوية مستقلة للمصفوفة السيادية باللونين الأحمر والذهبي."]],"matrix":"الثقافة والكرامة واستقلال الفكر","matrixText":"المصفوفة السيادية إطار تحريري وتنظيمي ضمن المنصة. الهوية الحمراء والذهبية مستوحاة من الطرز التراثية الأستورية.","values":[["الدليل","التمييز بين الحقائق الموثقة والمقترحات وما يزال قيد البحث."],["الموافقة","احترام المشاركة الواعية والخصوصية والكرامة الإنسانية."],["استقلال الإبداع","حماية التأليف والأعمال الثقافية الأصلية."]],"desk":"مكتب المعلومات","deskTitle":"اسأل عن المعلومات المنشورة","deskText":"بحث محلي في معلومات هذا الموقع فقط، وليس نموذج ذكاء اصطناعي توليديًا. لا تُرسل أسئلتك إلى خادم.","ph":"ما طبيعة هذه المنصة؟","ask":"اعرض الإجابة","prompt":"اكتب سؤالًا للبحث في المعلومات المنشورة.","support":"ساهم في تقدّم المشاريع","supportText":"معلومات الدعم ووسيلة الدفع الموثّقة قيد الإعداد. هذا الموقع لا يستقبل التبرعات ولا يجمع معلومات الدفع.","footer":"موقع رسمي للمشاريع المستقلة • لا توجد مدفوعات هنا","noq":"يرجى كتابة سؤال أولًا.","unknown":"هذه المعلومات غير متاحة ضمن النصوص المنشورة على الموقع.","answers":["هذه منصة مستقلة للبحث والنشر والموسيقى والتراث الثقافي.","المصفوفة السيادية مشروع تحريري وتنظيمي ذو هوية حمراء وذهبية.","غرفة القراءة تضم مشاريع كتب ومقالات، والمخطوطات الكاملة لم تُنشر بعد.","تتناول الأبحاث علم النفس والمنهجية والأخلاق والدراسات العابرة للثقافات.","تشمل المشاريع الموسيقية التأليف والإنتاج والأداء؛ ولم تُنشر التسجيلات غير المعتمدة.","وسيلة الدفع لم تُفعّل، ولا تُجمع التبرعات أو بيانات الدفع هنا.","مكتب المعلومات يجيب من محتوى الموقع الثابت فقط، دون اتصال بذكاء اصطناعي خارجي."]},"fa":{"nav":["پروژه‌ها","ماتریس مستقل","میز اطلاعات","پشتیبانی","پرونده شغلی","قرآن"],"tag":"آثار مستقل • دانش، فرهنگ و خلاقیت","hero":"اندیشه‌های مستقل؛ یک بستر پویا.","lead":"بستری مستقل برای نشر، پژوهش، موسیقی و میراث فرهنگی با احترام به حریم خصوصی و حقوق پدیدآورندگان.","explore":"کاوش پروژه‌ها","jobs":"آماده‌سازی درخواست شغلی","note":"این وبگاه پرداختی دریافت نمی‌کند.","ecosystem":"حوزه‌های فعالیت","work":"با فعالیت‌ها آشنا شوید","cards":[["اتاق مطالعه","پروژه‌های کتاب و ویرایش از جمله «عدالت جامعه ما» در دست تهیه‌اند. متن کامل هنوز منتشر نشده است."],["میز پژوهش","روان‌شناسی، اخلاق، روش‌شناسی و پژوهش میان‌فرهنگی. انتشار پژوهش‌ها در دست آماده‌سازی است."],["موسیقی و تولید","آهنگ‌سازی، تولید و اجرا. آثار صوتی تنها پس از تأیید منتشر خواهند شد."],["قرآن کریم","خوانش قرآن به زبان عربی؛ ابزارهای پیمایش و ترجمه در دست بررسی‌اند."],["میراث فرهنگی","پژوهش‌های فرهنگی و زبانی و هویت سرخ و زرین ویژه ماتریس مستقل."]],"matrix":"فرهنگ، کرامت و استقلال اندیشه","matrixText":"ماتریس مستقل مفهومی ویرایشی و سازمانی در این بستر است. هویت سرخ و زرین از طرح‌های میراث آستوری الهام می‌گیرد.","values":[["شواهد","جدا
