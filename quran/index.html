<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>قارئ القرآن الكريم • إل دي تي</title><style>body{margin:0;background:#fff8ef;color:#241c19;font:18px/1.9 system-ui,sans-serif}header{background:#241c19;color:white;padding:16px 22px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}header a{color:white;text-decoration:none;font-weight:750}header select{margin-inline-start:auto}.wrap{max-width:900px;margin:auto;padding:38px 20px}h1{font-size:clamp(34px,6vw,65px);line-height:1.3;margin:15px 0}.note{background:#fff0d8;border-right:4px solid #e97824;padding:16px;margin:25px 0;border-radius:4px}.panel{background:white;padding:24px;border:1px solid #e8d9c8;border-radius:12px;margin:25px 0}select,button{font:inherit;padding:10px;border:1px solid #c9ad91;border-radius:7px;background:white}button{background:#241c19;color:white;cursor:pointer}.verse{border-bottom:1px solid #eee2d4;padding:22px 0}.number{color:#9a541c;font-size:15px}.arabic{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:clamp(26px,4vw,38px);line-height:2.3;text-align:right;direction:rtl}footer{padding:25px;text-align:center;color:#665448;font-size:14px}</style></head><body><header><a href="../" id="home"></a><select id="lang" aria-label="اختيار اللغة"><option value="ar">العربية</option><option value="fa">فارسی</option><option value="ckb">کوردی</option><option value="he">עברית</option><option value="en-GB">English (UK)</option></select></header><main class="wrap"><h1 id="title"></h1><p id="intro"></p><p class="note" id="notice"></p><div class="panel"><label for="surah" id="choose"></label><p><select id="surah"><option value="1">الفاتحة</option></select> <button id="read"></button></p><p id="status" role="status"></p></div><section class="panel"><h2 id="heading">سورة الفاتحة</h2><div id="verses"></div></section></main><footer id="footer"></footer><script>const T={"ar":{"home":"الرئيسية","title":"قارئ القرآن الكريم","intro":"النص القرآني العربي الأصلي. يمكن تغيير لغة واجهة التصفح دون تغيير النص المقدس.","notice":"تتوافر هنا آيات القرآن باللغة العربية. لا نعرض ترجمة غير مراجَعة بوصفها ترجمة معتمدة. يتطلب تحميل السور اتصالًا بالشبكة.","choose":"اختر سورة","read":"اعرض السورة","wait":"اختر سورة للقراءة.","loading":"جارٍ تحميل السورة…","error":"تعذّر تحميل السورة. تحقق من اتصال الإنترنت وأعد المحاولة.","count":"عدد الآيات","verse":"الآية","footer":"النص العربي من خدمة بيانات القرآن • الواجهة مترجمة • دون إدخال معلومات شخصية"},"fa":{"home":"صفحه نخست","title":"خوانش قرآن کریم","intro":"متن اصلی قرآن به زبان عربی نمایش داده می‌شود. زبان رابط را می‌توان بدون تغییر متن مقدس عوض کرد.","notice":"آیه‌های قرآن در اینجا به عربی نمایش داده می‌شوند. هیچ ترجمه بررسی‌نشده‌ای به‌عنوان ترجمه تأییدشده ارائه نمی‌شود. برای بارگیری سوره‌ها اتصال اینترنت لازم است.","choose":"انتخاب سوره","read":"نمایش سوره","wait":"برای مطالعه سوره‌ای انتخاب کنید.","loading":"در حال بارگیری سوره…","error":"بارگیری ممکن نشد. اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.","count":"تعداد آیات","verse":"آیه","footer":"متن عربی از خدمات داده قرآن • رابط ترجمه‌شده • بدون دریافت اطلاعات شخصی"},"ckb":{"home":"پەڕەی سەرەکی","title":"خوێندنەوەی قورئانی پیرۆز","intro":"دەقی ڕەسەنی قورئان بە عەرەبی پیشان دەدرێت. دەتوانیت زمانی ڕووکار بگۆڕیت بەبێ گۆڕینی دەقی پیرۆز.","notice":"ئایەتەکان بە عەرەبی نیشان دەدرێن. وەرگێڕانی پێداچوونەوەی بۆ نەکراو وەک پشتڕاستکراوە پیشان نادرێت. پەیوەندی ئینتەرنێت پێویستە.","choose":"سوورەت هەڵبژێرە","read":"سوورەت پیشان بدە","wait":"سوورەتێک بۆ خوێندنەوە هەڵبژێرە.","loading":"سوورەت بار دەکرێت…","error":"بارکردن سەرکەوتوو نەبوو. پەیوەندی ئینتەرنێت بپشکنە.","count":"ژمارەی ئایەتەکان","verse":"ئایەت","footer":"دەقی عەرەبی لە خزمەتگوزاری زانیاری قورئان • ڕووکاری وەرگێڕدراو • بەبێ زانیاری کەسی"}},"he":{"home":"דף הבית","title":"קורא הקוראן","intro":"קריאת הטקסט הערבי המקורי של הקוראן. אפשר להחליף את שפת הממשק בלי לשנות את הטקסט המקורי.","notice":"הקוראן מוצג בערבית המקורית. תרגומים שלא נבדקו אינם מוצגים כמאומתים. יש צורך בחיבור לאינטרנט לטעינת הפרקים.","choose":"בחירת סורה","read":"הצגת סורה","wait":"בחרו סורה לקריאה.","loading":"הסורה נטענת…","error":"לא ניתן לטעון את הסורה. בדקו את החיבור לאינטרנט ונסו שוב.","count":"מספר הפסוקים","verse":"פסוק","footer":"הטקסט הערבי המקורי משירות נתוני קוראן • ממשק מתורגם • אין איסוף פרטים אישיים"},"en-GB":{"home":"Home","title":"Quran Reader","intro":"Read the original Arabic text of the Quran. Change the interface language without changing the original text.","notice":"The Quran is presented in its original Arabic. Unreviewed translations are not represented as verified. An internet connection is needed to load chapters.","choose":"Choose a surah","read":"Show surah","wait":"Choose a surah to read.","loading":"Loading surah…","error":"The surah could not be loaded. Check your internet connection and try again.","count":"Number of verses","verse":"Verse","footer":"Original Arabic text supplied by a Quran data service • Translated interface • No personal details collected"};let l="ar";const $=id=>document.getElementById(id),api="https://api.alquran.cloud/v1";function show(v){l=v;document.documentElement.lang=l;document.documentElement.dir=l==="en-GB"?"ltr":"rtl";for(const k of ["home","title","intro","notice","choose","footer"])$(k).textContent=T[l][k];$("read").textContent=T[l].read;if(!$("verses").children.length)$("status").textContent=T[l].wait;document.title=T[l].title+" • إل دي تي"}$("lang").addEventListener("change",e=>show(e.target.value));async function get(path){const r=await fetch(api+path);if(!r.ok)throw Error("network");const j=await r.json();if(j.code!==200)throw Error("source");return j.data}async function load(){const n=+$("surah").value;$("status").textContent=T[l].loading;try{const data=await get("/surah/"+n);$("heading").textContent=data.name;$("verses").replaceChildren(...data.ayahs.map(a=>{const e=document.createElement("article");e.className="verse";const num=document.createElement("div");num.className="number";num.textContent=T[l].verse+" "+a.numberInSurah;const p=document.createElement("div");p.className="arabic";p.lang="ar";p.textContent=a.text;e.append(num,p);return e}));$("status").textContent=T[l].count+": "+data.numberOfAyahs}catch(e){$("status").textContent=T[l].error}}async function initialize(){try{const meta=await get("/meta");$("surah").replaceChildren(...meta.surahs.references.map(s=>{const o=document.createElement("option");o.value=s.number;o.textContent=s.number+" • "+s.name;return o}));load()}catch(e){$("status").textContent=T[l].error}}$("read").addEventListener("click",load);$("surah").addEventListener("change",load);show("ar");initialize();</script></body></html>
