r><main class="wrap"><h1 id="title"></h1><p id="intro"></p><p class="note" id="notice"></p><div class="panel"><label for="surah" id="choose"></label><p><select id="surah"><option value="1">الفاتحة</option></select> <button id="read"></button></p><p id="status" role="status"></p></div><section class="panel"><h2 id="heading">سورة الفاتحة</h2><div id="verses"></div></section></main><footer id="footer"></footer><script>const T={"ar":{"home":"الرئيسية","title":"قارئ القرآن الكريم","intro":"النص القرآني العربي الأصلي. يمكن تغيير لغة واجهة التصفح دون تغيير النص المقدس.","notice":"تتوافر هنا آيات القرآن باللغة العربية. لا نعرض ترجمة غير مراجَعة بوصفها ترجمة معتمدة. يتطلب تحميل السور اتصالًا بالشبكة.","choose":"اختر سورة","read":"اعرض السورة","wait":"اختر سورة للقراءة.","loading":"جارٍ تحميل السورة…","error":"تعذّر تحميل السورة. تحقق من اتصال الإنترنت وأعد المحاولة.","count":"عدد الآيات","verse":"الآية","footer":"النص العربي من خدمة بيانات القرآن • الواجهة مترجمة • دون إدخال معلومات شخصية"},"fa":{"home":"صفحه نخست","title":"خوانش قرآن کریم","intro":"متن اصلی قرآن به زبان عربی نمایش داده می‌شود. زبان رابط را می‌توان بدون تغییر متن مقدس عوض کرد.","notice":"آیه‌های قرآن در اینجا به عربی نمایش داده می‌شوند. هیچ ترجمه بررسی‌نشده‌ای به‌عنوان ترجمه تأییدشده ارائه نمی‌شود. برای بارگیری سوره‌ها اتصال اینترنت لازم است.","choose":"انتخاب سوره","read":"نمایش سوره","wait":"برای مطالعه سوره‌ای انتخاب کنید.","loading":"در حال بارگیری سوره…","error":"بارگیری ممکن نشد. اتصال اینترنت را بررسی کرده و دوباره تلاش کنید.","count":"تعداد آیات","verse":"آیه","footer":"متن عربی از خدمات داده قرآن • رابط ترجمه‌شده • بدون دریافت اطلاعات شخصی"},"ckb":{"home":"پەڕەی سەرەکی","title":"خوێندنەوەی قورئانی پیرۆز","intro":"دەقی ڕەسەنی قورئان بە عەرەبی پیشان دەدرێت. دەتوانیت زمانی ڕووکار بگۆڕیت بەبێ گۆڕینی دەقی پیرۆز.","notice":"ئایەتەکان بە عەرەبی نیشان دەدرێن. وەرگێڕانی پێداچوونەوەی بۆ نەکراو وەک پشتڕاستکراوە پیشان نادرێت. پەیوەندی ئینتەرنێت پێویستە.","choose":"سوورەت هەڵبژێرە","read":"سوورەت پیشان بدە","wai tion get(path){const r=await fetch(api+path);if(!r.ok)throw Error("network");const j=await r.json();if(j.code!==200)throw Error("source");return j.data}async function load(){const n=+$("surah").value;$("status").textContent=T[l].loading;try{const data=await get("/surah/"+n);$("heading").textContent=data.name;$("verses").replaceChildren(...data.ayahs.map(a=>{const e=document.createElement("article");e.className="verse";const num=document.createElement("div");num.className="number";num.textContent=T[l].verse+" "+a.numberInSurah;const p=document.createElement("div");p.className="arabic";p.lang="ar";p.textContent=a.text;e.append(num,p);return e}));$("status").textContent=T[l].count+": "+data.numberOfAyahs}catch(e){$("status").textContent=T[l].error}}async function initialize(){try{const meta=await get("/meta");$("surah").replaceChildren(...meta.surahs.references.map(s=>{const o=document.createElement("option");o.value=s.number;o.textContent=s.number+" • "+s.name;return o}));load()}catch(e){$("status").textContent=T[l].error}}$("read").addEventListener("click",load);$("surah").addEventListener("change",load);show("ar");initialize();</script><script>(function(){const pick=document.querySelector("#language, #lang");if(!pick)return;const native=new Set(["ar","fa","ckb","he"]);pick.addEventListener("change",function(e){const code=pick.value;if(native.has(code))return;e.stopImmediatePropagation();const base=location.href.split("#")[0];location.assign("https://translate.google.com/translate?sl=ar&tl="+encodeURIComponent(code)+"&u="+encodeURIComponent(base));},true);})();</script></body></html>
